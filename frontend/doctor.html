<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Screening | Doctor Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .doctor-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .doctor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .doctor-header h1 {
            margin: 0;
        }

        .doctor-header p {
            margin-top: 8px;
            opacity: 0.7;
        }

        .doctor-badge {
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 24px;
            border-radius: 14px;
        }

        .stat-card span {
            display: block;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .stat-card strong {
            font-size: 32px;
        }

        .patients-card {
            padding: 25px;
            border-radius: 14px;
        }

        .patients-card-header {
            margin-bottom: 20px;
        }

        .patients-card-header h2 {
            margin: 0;
        }

        .patients-card-header p {
            opacity: 0.7;
        }

        .filter-container {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-input,
        .filter-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #4f8cff;
        }

        .filter-select option {
            background: #111827;
            color: white;
        }

        .filter-summary {
            margin-bottom: 15px;
            font-size: 14px;
            opacity: 0.7;
        }

        .table-container {
            overflow-x: auto;
        }

        .patients-table {
            width: 100%;
            border-collapse: collapse;
        }

        .patients-table th,
        .patients-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        .patients-table th {
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .action-buttons button {
            border: none;
            padding: 9px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }

        .history-button {
            background: #4f8cff;
            color: white;
        }

        .history-button:hover {
            opacity: 0.85;
        }

        .delete-history-button {
            background: #dc2626;
            color: white;
        }

        .delete-history-button:hover {
            background: #b91c1c;
        }

        .delete-patient-button {
            background: #7f1d1d;
            color: white;
        }

        .delete-patient-button:hover {
            background: #991b1b;
        }

        .loading-message,
        .empty-message,
        .error-message {
            text-align: center;
            padding: 30px;
        }

        .error-message h3,
        .empty-message h3 {
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .doctor-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filter-container {
                grid-template-columns: 1fr;
            }

            .patients-table {
                min-width: 950px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">
            DR <span>Screening</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="patient.html">Patient</a>
            <a href="login.html" id="logoutLink">Logout</a>
        </nav>
    </nav>


    <main class="doctor-container">

        <!-- Dashboard heading -->
        <header class="doctor-header">
            <div>
                <div class="section-label">
                    CLINICAL DASHBOARD
                </div>

                <h1>Doctor Dashboard</h1>

                <p>
                    Review patient screening records and AI-assisted results.
                </p>
            </div>

            <div class="doctor-badge">
                👨‍⚕️ Doctor
            </div>
        </header>


        <!-- Dashboard statistics -->
        <section class="stats-grid">

            <div class="stat-card">
                <span>Total Patients</span>
                <strong id="totalPatients">0</strong>
            </div>

            <div class="stat-card">
                <span>Total Screenings</span>
                <strong id="totalScreenings">0</strong>
            </div>

            <div class="stat-card">
                <span>Referable Cases</span>
                <strong id="referableCases">0</strong>
            </div>

        </section>


        <!-- Patient section -->
        <section class="patients-card">

            <div class="patients-card-header">
                <h2>Patients</h2>

                <p>
                    Select a patient to view their screening history.
                </p>
            </div>


            <!-- Search and filters -->
            <div class="filter-container">

                <input
                    type="text"
                    id="patientSearch"
                    class="filter-input"
                    placeholder="🔍 Search by Patient ID or Name..."
                >

                <select id="genderFilter" class="filter-select">

                    <option value="all">
                        All Genders
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>


                <select id="screeningFilter" class="filter-select">

                    <option value="all">
                        All Patients
                    </option>

                    <option value="screened">
                        Has Screenings
                    </option>

                    <option value="unscreened">
                        No Screenings
                    </option>

                    <option value="referable">
                        Referable Cases
                    </option>

                </select>

            </div>


            <div
                id="filterSummary"
                class="filter-summary"
            >
                Showing all patients
            </div>


            <!-- Patient table -->
            <div
                id="patientsContainer"
                class="table-container"
            >
                <div class="loading-message">
                    Loading patients...
                </div>
            </div>

        </section>

    </main>


    <script>

        /* -------------------------------------------------------
           Configuration
        ------------------------------------------------------- */

        const BACKEND_URL = "http://localhost:8084";


        /* -------------------------------------------------------
           Application state
        ------------------------------------------------------- */

        let patients = [];
        let screenings = [];


        /* -------------------------------------------------------
           DOM helpers
        ------------------------------------------------------- */

        const getElement = (id) => {
            return document.getElementById(id);
        };


        /* -------------------------------------------------------
           Load patients
        ------------------------------------------------------- */

        async function loadPatients() {

            try {

                const response = await fetch(
                    `${BACKEND_URL}/api/patients`
                );

                if (!response.ok) {
                    throw new Error("Unable to fetch patients.");
                }

                patients = await response.json();

                getElement("totalPatients").textContent =
                    patients.length;

                await loadScreeningData();

                applyFilters();

            } catch (error) {

                console.error("Patient loading error:", error);

                getElement("patientsContainer").innerHTML = `
                    <div class="error-message">
                        <h3>Unable to load dashboard</h3>
                        <p>
                            Please make sure Spring Boot
                            is running on port 8084.
                        </p>
                    </div>
                `;
            }
        }


        /* -------------------------------------------------------
           Load screening records
        ------------------------------------------------------- */

        async function loadScreeningData() {

            screenings = [];

            for (const patient of patients) {

                try {

                    const response = await fetch(
                        `${BACKEND_URL}/api/screenings/patient/${patient.id}`
                    );

                    if (!response.ok) {
                        continue;
                    }

                    const records = await response.json();

                    if (Array.isArray(records)) {
                        screenings.push(...records);
                    }

                } catch (error) {

                    console.error(
                        `Could not load screenings for patient ${patient.id}`,
                        error
                    );
                }
            }

            updateStatistics();
        }


        /* -------------------------------------------------------
           Update dashboard statistics
        ------------------------------------------------------- */

        function updateStatistics() {

            getElement("totalPatients").textContent =
                patients.length;

            getElement("totalScreenings").textContent =
                screenings.length;

            const referableTotal = screenings.filter(
                record =>
                    record.referableStatus === "Referable DR"
            ).length;

            getElement("referableCases").textContent =
                referableTotal;
        }


        /* -------------------------------------------------------
           Render patient table
        ------------------------------------------------------- */

        function renderPatients(list) {

            const container =
                getElement("patientsContainer");


            if (!list.length) {

                container.innerHTML = `
                    <div class="empty-message">
                        <h3>No Patients Found</h3>
                        <p>
                            No patients match the selected filters.
                        </p>
                    </div>
                `;

                return;
            }


            let html = `
                <table class="patients-table">

                    <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Screenings</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
            `;


            list.forEach(patient => {

                const patientRecords =
                    getPatientScreenings(patient.id);


                html += `
                    <tr>

                        <td>
                            ${patient.id}
                        </td>

                        <td>
                            ${escapeHTML(patient.name)}
                        </td>

                        <td>
                            ${patient.age}
                        </td>

                        <td>
                            ${escapeHTML(patient.gender)}
                        </td>

                        <td>
                            ${patientRecords.length}
                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="history-button"
                                    onclick="viewHistory(${patient.id})"
                                >
                                    View History
                                </button>

                                <button
                                    class="delete-history-button"
                                    onclick="removeHistory(${patient.id})"
                                >
                                    Delete History
                                </button>

                                <button
                                    class="delete-patient-button"
                                    onclick="removePatient(${patient.id})"
                                >
                                    Delete Patient
                                </button>

                            </div>

                        </td>

                    </tr>
                `;
            });


            html += `
                    </tbody>
                </table>
            `;


            container.innerHTML = html;
        }


        /* -------------------------------------------------------
           Get screenings belonging to a patient
        ------------------------------------------------------- */

        function getPatientScreenings(patientId) {

            return screenings.filter(
                record => record.patientId === patientId
            );
        }


        /* -------------------------------------------------------
           Search and filter patients
        ------------------------------------------------------- */

        function applyFilters() {

            const searchText =
                getElement("patientSearch")
                    .value
                    .trim()
                    .toLowerCase();


            const selectedGender =
                getElement("genderFilter").value
                    .toLowerCase();


            const screeningMode =
                getElement("screeningFilter").value;


            const filtered = patients.filter(patient => {

                /* Search */

                const idText =
                    String(patient.id).toLowerCase();

                const nameText =
                    String(patient.name || "").toLowerCase();

                const searchMatch =
                    idText.includes(searchText) ||
                    nameText.includes(searchText);


                if (!searchMatch) {
                    return false;
                }


                /* Gender */

                const gender =
                    String(patient.gender || "")
                        .toLowerCase();

                const genderMatch =
                    selectedGender === "all" ||
                    gender === selectedGender;


                if (!genderMatch) {
                    return false;
                }


                /* Screening status */

                const patientRecords =
                    getPatientScreenings(patient.id);


                if (screeningMode === "screened") {
                    return patientRecords.length > 0;
                }


                if (screeningMode === "unscreened") {
                    return patientRecords.length === 0;
                }


                if (screeningMode === "referable") {

                    return patientRecords.some(
                        record =>
                            record.referableStatus === "Referable DR"
                    );
                }


                return true;
            });


            getElement("filterSummary").textContent =
                `Showing ${filtered.length} of ${patients.length} patients`;


            renderPatients(filtered);
        }


        /* -------------------------------------------------------
           Open patient screening history
        ------------------------------------------------------- */

        function viewHistory(patientId) {

            const patient =
                patients.find(item => item.id === patientId);


            if (!patient) {
                return;
            }


            localStorage.setItem(
                "patientId",
                patient.id
            );

            localStorage.setItem(
                "patientName",
                patient.name
            );

            localStorage.setItem(
                "patientAge",
                patient.age
            );

            localStorage.setItem(
                "patientGender",
                patient.gender
            );


            window.location.href =
                "history.html";
        }


        /* -------------------------------------------------------
           Delete screening history
        ------------------------------------------------------- */

        async function removeHistory(patientId) {

            const patient =
                patients.find(item => item.id === patientId);


            if (!patient) {
                return;
            }


            const patientRecords =
                getPatientScreenings(patientId);


            if (patientRecords.length === 0) {

                alert(
                    `No screening history found for ${patient.name}.`
                );

                return;
            }


            const confirmed = confirm(

                `Are you sure you want to delete ALL screening history for ${patient.name} (Patient ID: ${patient.id})?\n\n` +

                `This will delete ${patientRecords.length} screening record(s).\n\n` +

                `The patient record itself will NOT be deleted.\n\n` +

                `This action cannot be undone.`
            );


            if (!confirmed) {
                return;
            }


            try {

                const response = await fetch(
                    `${BACKEND_URL}/api/screenings/patient/${patientId}`,
                    {
                        method: "DELETE"
                    }
                );


                if (!response.ok) {

                    if (response.status === 404) {

                        alert(
                            "No screening history was found for this patient."
                        );

                    } else {

                        alert(
                            "Failed to delete screening history."
                        );
                    }

                    return;
                }


                /* Remove deleted records locally */

                screenings = screenings.filter(
                    record =>
                        record.patientId !== patientId
                );


                updateStatistics();
                applyFilters();


                alert(
                    `Screening history for ${patient.name} has been deleted successfully.`
                );


            } catch (error) {

                console.error(
                    "History deletion error:",
                    error
                );

                alert(
                    "Unable to delete screening history. Please make sure the backend is running."
                );
            }
        }


        /* -------------------------------------------------------
           Delete complete patient
        ------------------------------------------------------- */

        async function removePatient(patientId) {

            const patient =
                patients.find(item => item.id === patientId);


            if (!patient) {
                return;
            }


            const confirmed = confirm(

                `Are you sure you want to permanently delete ${patient.name} (Patient ID: ${patient.id})?\n\n` +

                `This will delete the patient AND ALL of their screening history.\n\n` +

                `This action cannot be undone.`
            );


            if (!confirmed) {
                return;
            }


            try {

                const response = await fetch(
                    `${BACKEND_URL}/api/patients/${patientId}`,
                    {
                        method: "DELETE"
                    }
                );


                if (!response.ok) {

                    if (response.status === 404) {

                        alert("Patient not found.");

                    } else {

                        alert("Failed to delete patient.");
                    }

                    return;
                }


                /* Update local patient list */

                patients = patients.filter(
                    item =>
                        item.id !== patientId
                );


                /* Remove related screenings */

                screenings = screenings.filter(
                    record =>
                        record.patientId !== patientId
                );


                updateStatistics();
                applyFilters();


                alert(
                    `${patient.name} and their screening history have been deleted successfully.`
                );


            } catch (error) {

                console.error(
                    "Patient deletion error:",
                    error
                );

                alert(
                    "Unable to delete patient. Please make sure the backend is running."
                );
            }
        }


        /* -------------------------------------------------------
           Prevent HTML injection when displaying user data
        ------------------------------------------------------- */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* -------------------------------------------------------
           Filter event listeners
        ------------------------------------------------------- */

        getElement("patientSearch")
            .addEventListener(
                "input",
                applyFilters
            );


        getElement("genderFilter")
            .addEventListener(
                "change",
                applyFilters
            );


        getElement("screeningFilter")
            .addEventListener(
                "change",
                applyFilters
            );


        /* -------------------------------------------------------
           Start dashboard
        ------------------------------------------------------- */

        loadPatients();

    </script>

</body>
</html>
