<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Screening | Doctor Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .doctor-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .doctor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .doctor-header h1 {
            margin: 0;
        }

        .doctor-header p {
            margin-top: 8px;
            opacity: 0.7;
        }

        .doctor-badge {
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 24px;
            border-radius: 14px;
        }

        .stat-card span {
            display: block;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .stat-card strong {
            font-size: 32px;
        }

        .patients-card {
            padding: 25px;
            border-radius: 14px;
        }

        .patients-card-header {
            margin-bottom: 20px;
        }

        .patients-card-header h2 {
            margin: 0;
        }

        .patients-card-header p {
            opacity: 0.7;
        }

        /* ================= FILTERS ================= */

        .filter-container {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .filter-input,
        .filter-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #4f8cff;
        }

        .filter-select option {
            background: #111827;
            color: white;
        }

        .filter-summary {
            margin-bottom: 15px;
            font-size: 14px;
            opacity: 0.7;
        }

        .table-container {
            overflow-x: auto;
        }

        .patients-table {
            width: 100%;
            border-collapse: collapse;
        }

        .patients-table th,
        .patients-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        .patients-table th {
            font-weight: 600;
        }

        /* ================= VIEW HISTORY ================= */

        .history-button {
            padding: 9px 14px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        /* ================= DELETE HISTORY ================= */

        .delete-history-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 6px;
            font-size: 13px;
        }

        .delete-history-button:hover {
            background: #b91c1c;
        }

        /* ================= DELETE PATIENT ================= */

        .delete-patient-button {
            background: #7f1d1d;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 6px;
            font-size: 13px;
        }

        .delete-patient-button:hover {
            background: #991b1b;
        }

        .loading-message,
        .empty-message,
        .error-message {
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 768px) {

            .doctor-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filter-container {
                grid-template-columns: 1fr;
            }

            .patients-table {
                min-width: 950px;
            }

        }

    </style>

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            DR <span>Screening</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="patient.html">Patient</a>
            <a href="login.html" id="logoutLink">Logout</a>
        </nav>

    </nav>


    <!-- ================= DOCTOR DASHBOARD ================= -->

    <main class="doctor-container">


        <!-- HEADER -->

        <div class="doctor-header">

            <div>

                <div class="section-label">
                    CLINICAL DASHBOARD
                </div>

                <h1>
                    Doctor Dashboard
                </h1>

                <p>
                    Review patient screening records and AI-assisted results.
                </p>

            </div>


            <div class="doctor-badge">
                👨‍⚕️ Doctor
            </div>

        </div>


        <!-- ================= STATISTICS ================= -->

        <div class="stats-grid">


            <div class="stat-card">

                <span>
                    Total Patients
                </span>

                <strong id="totalPatients">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Total Screenings
                </span>

                <strong id="totalScreenings">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Referable Cases
                </span>

                <strong id="referableCases">
                    0
                </strong>

            </div>

        </div>


        <!-- ================= PATIENT LIST ================= -->

        <section class="patients-card">

            <div class="patients-card-header">

                <h2>
                    Patients
                </h2>

                <p>
                    Select a patient to view their screening history.
                </p>

            </div>


            <!-- ================= SEARCH & FILTERS ================= -->

            <div class="filter-container">

                <input
                    type="text"
                    id="patientSearch"
                    class="filter-input"
                    placeholder="🔍 Search by Patient ID or Name..."
                    oninput="applyFilters()"
                >


                <select
                    id="genderFilter"
                    class="filter-select"
                    onchange="applyFilters()"
                >

                    <option value="all">
                        All Genders
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>


                <select
                    id="screeningFilter"
                    class="filter-select"
                    onchange="applyFilters()"
                >

                    <option value="all">
                        All Patients
                    </option>

                    <option value="screened">
                        Has Screenings
                    </option>

                    <option value="unscreened">
                        No Screenings
                    </option>

                    <option value="referable">
                        Referable Cases
                    </option>

                </select>

            </div>


            <div
                id="filterSummary"
                class="filter-summary"
            >
                Showing all patients
            </div>


            <div
                id="patientsContainer"
                class="table-container"
            >

                <div class="loading-message">
                    Loading patients...
                </div>

            </div>

        </section>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const BACKEND_URL = "http://localhost:8084";


        let patients = [];
        let allScreenings = [];


        /* =====================================================
           LOAD DASHBOARD
           ===================================================== */

        async function loadDashboard() {

            try {

                const patientsResponse = await fetch(
                    `${BACKEND_URL}/api/patients`
                );


                if (!patientsResponse.ok) {

                    throw new Error(
                        "Failed to load patients"
                    );

                }


                patients = await patientsResponse.json();


                document.getElementById(
                    "totalPatients"
                ).textContent = patients.length;


                await loadAllScreenings();


                displayPatients();

            }


            catch (error) {

                console.error(error);


                document.getElementById(
                    "patientsContainer"
                ).innerHTML = `

                    <div class="error-message">

                        <h3>
                            Unable to load dashboard
                        </h3>

                        <p>
                            Please make sure Spring Boot
                            is running on port 8084.
                        </p>

                    </div>

                `;

            }

        }


        /* =====================================================
           LOAD SCREENINGS
           ===================================================== */

        async function loadAllScreenings() {

            allScreenings = [];


            for (const patient of patients) {

                try {

                    const response = await fetch(
                        `${BACKEND_URL}/api/screenings/patient/${patient.id}`
                    );


                    if (!response.ok) {
                        continue;
                    }


                    const screenings =
                        await response.json();


                    if (Array.isArray(screenings)) {

                        allScreenings.push(
                            ...screenings
                        );

                    }

                }


                catch (error) {

                    console.error(
                        `Could not load screenings for patient ${patient.id}`,
                        error
                    );

                }

            }


            updateStats();

        }


        /* =====================================================
           UPDATE DASHBOARD STATISTICS
           ===================================================== */

        function updateStats() {

            document.getElementById(
                "totalPatients"
            ).textContent = patients.length;


            document.getElementById(
                "totalScreenings"
            ).textContent = allScreenings.length;


            const referableCount =
                allScreenings.filter(
                    screening =>
                        screening.referableStatus ===
                        "Referable DR"
                ).length;


            document.getElementById(
                "referableCases"
            ).textContent = referableCount;

        }


        /* =====================================================
           DISPLAY PATIENTS
           ===================================================== */

        function displayPatients(patientList = patients) {

            const container =
                document.getElementById(
                    "patientsContainer"
                );


            if (!patientList || patientList.length === 0) {

                container.innerHTML = `

                    <div class="empty-message">

                        <h3>
                            No Patients Found
                        </h3>

                        <p>
                            No patients match the selected filters.
                        </p>

                    </div>

                `;

                return;

            }


            let tableHTML = `

                <table class="patients-table">

                    <thead>

                        <tr>

                            <th>
                                Patient ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Age
                            </th>

                            <th>
                                Gender
                            </th>

                            <th>
                                Screenings
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody>

            `;


            patientList.forEach(patient => {

                const patientScreenings =
                    allScreenings.filter(
                        screening =>
                            screening.patientId ===
                            patient.id
                    );


                tableHTML += `

                    <tr>

                        <td>
                            ${patient.id}
                        </td>

                        <td>
                            ${escapeHTML(patient.name)}
                        </td>

                        <td>
                            ${patient.age}
                        </td>

                        <td>
                            ${escapeHTML(patient.gender)}
                        </td>

                        <td>
                            ${patientScreenings.length}
                        </td>

                        <td>

                            <button
                                class="history-button"
                                onclick="viewPatientHistory(${patient.id})"
                            >
                                View History
                            </button>

                            <button
                                class="delete-history-button"
                                onclick="deletePatientHistory(${patient.id}, '${escapeHTML(patient.name)}')"
                            >
                                Delete History
                            </button>

                            <button
                                class="delete-patient-button"
                                onclick="deletePatient(${patient.id}, '${escapeHTML(patient.name)}')"
                            >
                                Delete Patient
                            </button>

                        </td>

                    </tr>

                `;

            });


            tableHTML += `

                    </tbody>

                </table>

            `;


            container.innerHTML = tableHTML;

        }


        /* =====================================================
           SEARCH + FILTER
           ===================================================== */

        function applyFilters() {

            const searchValue =
                document.getElementById(
                    "patientSearch"
                ).value
                .trim()
                .toLowerCase();


            const genderValue =
                document.getElementById(
                    "genderFilter"
                ).value
                .toLowerCase();


            const screeningValue =
                document.getElementById(
                    "screeningFilter"
                ).value;


            const filteredPatients =
                patients.filter(patient => {

                    /* =========================
                       SEARCH
                       ========================= */

                    const patientId =
                        String(patient.id)
                        .toLowerCase();

                    const patientName =
                        String(patient.name || "")
                        .toLowerCase();


                    const matchesSearch =
                        patientId.includes(searchValue) ||
                        patientName.includes(searchValue);


                    if (!matchesSearch) {
                        return false;
                    }


                    /* =========================
                       GENDER FILTER
                       ========================= */

                    const patientGender =
                        String(patient.gender || "")
                        .toLowerCase();


                    const matchesGender =
                        genderValue === "all" ||
                        patientGender === genderValue;


                    if (!matchesGender) {
                        return false;
                    }


                    /* =========================
                       SCREENING FILTER
                       ========================= */

                    const patientScreenings =
                        allScreenings.filter(
                            screening =>
                                screening.patientId ===
                                patient.id
                        );


                    if (
                        screeningValue ===
                        "screened"
                    ) {

                        return patientScreenings.length > 0;

                    }


                    if (
                        screeningValue ===
                        "unscreened"
                    ) {

                        return patientScreenings.length === 0;

                    }


                    if (
                        screeningValue ===
                        "referable"
                    ) {

                        return patientScreenings.some(
                            screening =>
                                screening.referableStatus ===
                                "Referable DR"
                        );

                    }


                    return true;

                });


            /* =========================
               UPDATE SUMMARY
               ========================= */

            document.getElementById(
                "filterSummary"
            ).textContent =
                `Showing ${filteredPatients.length} of ${patients.length} patients`;


            displayPatients(filteredPatients);

        }


        /* =====================================================
           VIEW PATIENT HISTORY
           ===================================================== */

        function viewPatientHistory(patientId) {

            const patient =
                patients.find(
                    p => p.id === patientId
                );


            if (!patient) {
                return;
            }


            /*
             * Store selected patient temporarily.
             * history.html will use these values.
             */

            localStorage.setItem(
                "patientId",
                patient.id
            );

            localStorage.setItem(
                "patientName",
                patient.name
            );

            localStorage.setItem(
                "patientAge",
                patient.age
            );

            localStorage.setItem(
                "patientGender",
                patient.gender
            );


            window.location.href =
                "history.html";

        }


        /* =====================================================
           DELETE PATIENT SCREENING HISTORY
           ===================================================== */

        async function deletePatientHistory(
            patientId,
            patientName
        ) {

            const patientScreenings =
                allScreenings.filter(
                    screening =>
                        screening.patientId === patientId
                );


            /* ==========================================
               CHECK IF HISTORY EXISTS
               ========================================== */

            if (patientScreenings.length === 0) {

                alert(
                    `No screening history found for ${patientName}.`
                );

                return;
            }


            /* ==========================================
               CONFIRM DELETE
               ========================================== */

            const confirmed = confirm(

                `Are you sure you want to delete ALL screening history for ${patientName} (Patient ID: ${patientId})?\n\n` +

                `This will delete ${patientScreenings.length} screening record(s).\n\n` +

                `The patient record itself will NOT be deleted.\n\n` +

                `This action cannot be undone.`

            );


            if (!confirmed) {
                return;
            }


            try {

                const response = await fetch(

                    `${BACKEND_URL}/api/screenings/patient/${patientId}`,

                    {
                        method: "DELETE"
                    }

                );


                if (!response.ok) {

                    if (response.status === 404) {

                        alert(
                            "No screening history was found for this patient."
                        );

                    }

                    else {

                        alert(
                            "Failed to delete screening history."
                        );

                    }

                    return;
                }


                /* ==========================================
                   REMOVE SCREENINGS FROM FRONTEND
                   ========================================== */

                allScreenings =
                    allScreenings.filter(
                        screening =>
                            screening.patientId !== patientId
                    );


                /* ==========================================
                   UPDATE STATISTICS
                   ========================================== */

                updateStats();


                /* ==========================================
                   RE-APPLY CURRENT FILTERS
                   ========================================== */

                applyFilters();


                alert(
                    `Screening history for ${patientName} has been deleted successfully.`
                );

            }


            catch (error) {

                console.error(
                    "Error deleting screening history:",
                    error
                );


                alert(
                    "Unable to delete screening history. Please make sure the backend is running."
                );

            }

        }


        /* =====================================================
           DELETE COMPLETE PATIENT
           ===================================================== */

        async function deletePatient(
            patientId,
            patientName
        ) {

            const confirmed = confirm(

                `Are you sure you want to permanently delete ${patientName} (Patient ID: ${patientId})?\n\n` +

                `This will delete the patient AND ALL of their screening history.\n\n` +

                `This action cannot be undone.`

            );


            if (!confirmed) {
                return;
            }


            try {

                const response = await fetch(

                    `${BACKEND_URL}/api/patients/${patientId}`,

                    {
                        method: "DELETE"
                    }

                );


                /* ==========================================
                   HANDLE RESPONSE
                   ========================================== */

                if (!response.ok) {

                    if (response.status === 404) {

                        alert(
                            "Patient not found."
                        );

                    }

                    else {

                        alert(
                            "Failed to delete patient."
                        );

                    }

                    return;
                }


                /* ==========================================
                   REMOVE PATIENT FROM FRONTEND
                   ========================================== */

                patients =
                    patients.filter(
                        patient =>
                            patient.id !== patientId
                    );


                /* ==========================================
                   REMOVE PATIENT SCREENINGS
                   ========================================== */

                allScreenings =
                    allScreenings.filter(
                        screening =>
                            screening.patientId !== patientId
                    );


                /* ==========================================
                   UPDATE STATISTICS
                   ========================================== */

                updateStats();


                /* ==========================================
                   RE-APPLY CURRENT FILTERS
                   ========================================== */

                applyFilters();


                /* ==========================================
                   SUCCESS MESSAGE
                   ========================================== */

                alert(

                    `${patientName} and their screening history have been deleted successfully.`

                );

            }


            catch (error) {

                console.error(
                    "Error deleting patient:",
                    error
                );


                alert(

                    "Unable to delete patient. Please make sure the backend is running."

                );

            }

        }


        /* =====================================================
           HTML SAFETY
           ===================================================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           START DASHBOARD
           ===================================================== */

        loadDashboard();

    </script>


</body>

</html>
