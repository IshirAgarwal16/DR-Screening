<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Screening | Doctor Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .doctor-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .doctor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .doctor-header h1 {
            margin: 0;
        }

        .doctor-header p {
            margin-top: 8px;
            opacity: 0.7;
        }

        .doctor-badge {
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 24px;
            border-radius: 14px;
        }

        .stat-card span {
            display: block;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .stat-card strong {
            font-size: 32px;
        }

        .patients-card {
            padding: 25px;
            border-radius: 14px;
        }

        .patients-card-header {
            margin-bottom: 20px;
        }

        .patients-card-header h2 {
            margin: 0;
        }

        .patients-card-header p {
            opacity: 0.7;
        }

        .table-container {
            overflow-x: auto;
        }

        .patients-table {
            width: 100%;
            border-collapse: collapse;
        }

        .patients-table th,
        .patients-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        .patients-table th {
            font-weight: 600;
        }

        .history-button {
            padding: 9px 14px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .loading-message,
        .empty-message,
        .error-message {
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 768px) {

            .doctor-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .patients-table {
                min-width: 700px;
            }

        }

    </style>

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            DR <span>Screening</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="patient.html">Patient</a>
            <a href="login.html" id="logoutLink">Logout</a>
        </nav>

    </nav>


    <!-- ================= DOCTOR DASHBOARD ================= -->

    <main class="doctor-container">


        <!-- HEADER -->

        <div class="doctor-header">

            <div>

                <div class="section-label">
                    CLINICAL DASHBOARD
                </div>

                <h1>
                    Doctor Dashboard
                </h1>

                <p>
                    Review patient screening records and AI-assisted results.
                </p>

            </div>


            <div class="doctor-badge">
                👨‍⚕️ Doctor
            </div>

        </div>


        <!-- ================= STATISTICS ================= -->

        <div class="stats-grid">


            <div class="stat-card">

                <span>
                    Total Patients
                </span>

                <strong id="totalPatients">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Total Screenings
                </span>

                <strong id="totalScreenings">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Referable Cases
                </span>

                <strong id="referableCases">
                    0
                </strong>

            </div>

        </div>


        <!-- ================= PATIENT LIST ================= -->

        <section class="patients-card">

            <div class="patients-card-header">

                <h2>
                    Patients
                </h2>

                <p>
                    Select a patient to view their screening history.
                </p>

            </div>


            <div
                id="patientsContainer"
                class="table-container"
            >

                <div class="loading-message">
                    Loading patients...
                </div>

            </div>

        </section>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const BACKEND_URL = "http://localhost:8084";


        let patients = [];
        let allScreenings = [];


        /* =====================================================
           LOAD DASHBOARD
           ===================================================== */

        async function loadDashboard() {

            try {

                const patientsResponse = await fetch(
                    `${BACKEND_URL}/api/patients`
                );


                if (!patientsResponse.ok) {

                    throw new Error(
                        "Failed to load patients"
                    );

                }


                patients = await patientsResponse.json();


                document.getElementById(
                    "totalPatients"
                ).textContent = patients.length;


                await loadAllScreenings();


                displayPatients();


            } catch (error) {

                console.error(error);


                document.getElementById(
                    "patientsContainer"
                ).innerHTML = `

                    <div class="error-message">

                        <h3>
                            Unable to load dashboard
                        </h3>

                        <p>
                            Please make sure Spring Boot
                            is running on port 8084.
                        </p>

                    </div>

                `;

            }

        }


        /* =====================================================
           LOAD SCREENINGS
           ===================================================== */

        async function loadAllScreenings() {

            allScreenings = [];


            for (const patient of patients) {

                try {

                    const response = await fetch(
                        `${BACKEND_URL}/api/screenings/patient/${patient.id}`
                    );


                    if (!response.ok) {
                        continue;
                    }


                    const screenings =
                        await response.json();


                    if (Array.isArray(screenings)) {

                        allScreenings.push(
                            ...screenings
                        );

                    }

                } catch (error) {

                    console.error(
                        `Could not load screenings for patient ${patient.id}`,
                        error
                    );

                }

            }


            document.getElementById(
                "totalScreenings"
            ).textContent = allScreenings.length;


            const referableCount =
                allScreenings.filter(
                    screening =>
                        screening.referableStatus ===
                        "Referable DR"
                ).length;


            document.getElementById(
                "referableCases"
            ).textContent = referableCount;

        }


        /* =====================================================
           DISPLAY PATIENTS
           ===================================================== */

        function displayPatients() {

            const container =
                document.getElementById(
                    "patientsContainer"
                );


            if (!patients || patients.length === 0) {

                container.innerHTML = `

                    <div class="empty-message">

                        <h3>
                            No Patients Found
                        </h3>

                        <p>
                            No patients have been registered yet.
                        </p>

                    </div>

                `;

                return;
            }


            let tableHTML = `

                <table class="patients-table">

                    <thead>

                        <tr>

                            <th>
                                Patient ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Age
                            </th>

                            <th>
                                Gender
                            </th>

                            <th>
                                Screenings
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            patients.forEach(patient => {

                const patientScreenings =
                    allScreenings.filter(
                        screening =>
                            screening.patientId ===
                            patient.id
                    );


                tableHTML += `

                    <tr>

                        <td>
                            ${patient.id}
                        </td>

                        <td>
                            ${escapeHTML(patient.name)}
                        </td>

                        <td>
                            ${patient.age}
                        </td>

                        <td>
                            ${escapeHTML(patient.gender)}
                        </td>

                        <td>
                            ${patientScreenings.length}
                        </td>

                        <td>

                            <button
                                class="history-button"
                                onclick="viewPatientHistory(${patient.id})"
                            >
                                View History
                            </button>

                        </td>

                    </tr>

                `;

            });


            tableHTML += `

                    </tbody>

                </table>

            `;


            container.innerHTML = tableHTML;

        }


        /* =====================================================
           VIEW PATIENT HISTORY
           ===================================================== */

        function viewPatientHistory(patientId) {

            const patient =
                patients.find(
                    p => p.id === patientId
                );


            if (!patient) {
                return;
            }


            /*
             * Store selected patient temporarily.
             * history.html will use these values.
             */

            localStorage.setItem(
                "patientId",
                patient.id
            );

            localStorage.setItem(
                "patientName",
                patient.name
            );

            localStorage.setItem(
                "patientAge",
                patient.age
            );

            localStorage.setItem(
                "patientGender",
                patient.gender
            );


            window.location.href =
                "history.html";

        }


        /* =====================================================
           HTML SAFETY
           ===================================================== */

        function escapeHTML(value) {

            if (value === null ||
                value === undefined) {

                return "";

            }


            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           START DASHBOARD
           ===================================================== */

        loadDashboard();

    </script>


</body>

</html>
