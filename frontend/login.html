<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DR Screening</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                DR<span>Screening</span>
            </div>

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to access the DR Screening platform
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Login As
                    </label>

                    <div class="role-options">

                        <label class="role-option">

                            <input
                                type="radio"
                                name="role"
                                value="Healthcare Worker"
                                checked
                            >

                            <span>
                                Healthcare Worker
                            </span>

                        </label>


                        <label class="role-option">

                            <input
                                type="radio"
                                name="role"
                                value="Doctor"
                            >

                            <span>
                                Doctor
                            </span>

                        </label>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>

            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- Frontend JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
