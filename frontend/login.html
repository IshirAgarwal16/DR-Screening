<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Screening | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                DR<span>Screening</span>
            </div>


            <h1>
                Welcome Back
            </h1>

            <p class="login-subtitle">
                Sign in to continue to the DR Screening platform.
            </p>


            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- User role -->
                <div class="form-group">

                    <label>
                        Login As
                    </label>

                    <div class="role-options">

                        <label class="role-option">

                            <input
                                type="radio"
                                name="role"
                                value="Healthcare Worker"
                                checked
                            >

                            <span>
                                Healthcare Worker
                            </span>

                        </label>


                        <label class="role-option">

                            <input
                                type="radio"
                                name="role"
                                value="Doctor"
                            >

                            <span>
                                Doctor
                            </span>

                        </label>

                    </div>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="login-submit"
                >
                    Sign In
                </button>

            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
