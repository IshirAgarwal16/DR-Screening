<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Screening | Screening History</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            DR <span>Screening</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="patient.html">Patient</a>
            <a href="login.html">Logout</a>
        </nav>

    </nav>


    <main class="history-container">

        <!-- Page heading -->
        <header class="history-header">

            <div class="section-label">
                SCREENING RECORDS
            </div>

            <h1>Screening History</h1>

            <p>
                Review previous diabetic retinopathy screening results.
            </p>
            <p class="clinical-disclaimer">
                AI-assisted screening estimates are shown for review and are not confirmed diagnoses.
            </p>

        </header>


        <!-- Patient details -->
        <section class="patient-info-card">

            <div class="section-label">
                PATIENT INFORMATION
            </div>

            <div class="patient-info-grid">

                <div class="patient-info-item">
                    <span>Patient ID</span>
                    <strong id="patientId">—</strong>
                </div>

                <div class="patient-info-item">
                    <span>Name</span>
                    <strong id="patientName">—</strong>
                </div>

                <div class="patient-info-item">
                    <span>Age</span>
                    <strong id="patientAge">—</strong>
                </div>

                <div class="patient-info-item">
                    <span>Gender</span>
                    <strong id="patientGender">—</strong>
                </div>

            </div>

        </section>


        <section class="history-tools" aria-label="Filter screening history">
            <div class="history-search">
                <label for="historySearch">Search screenings</label>
                <input id="historySearch" type="search" placeholder="Search by screening ID, grade, or class">
            </div>
            <div class="history-status-filter">
                <label for="historyStatusFilter">Referable status</label>
                <select id="historyStatusFilter">
                    <option value="all">All statuses</option>
                </select>
            </div>
            <p id="historySummary" class="history-summary" aria-live="polite"></p>
        </section>

        <!-- Screening records -->
        <section>

            <div
                id="screeningsContainer"
                class="screenings-container"
            >
                <div class="loading-message">
                    Loading screening history...
                </div>
            </div>

        </section>


        <button
            type="button"
            class="back-button"
            onclick="goBackToScreening()"
        >
            ← Back to Screening
        </button>

    </main>


    <script>

        const BACKEND_URL = "http://localhost:8084";


        /*
         * Patient information is saved when a patient
         * is selected or registered.
         */
        const patientId = localStorage.getItem("patientId");
        const patientName = localStorage.getItem("patientName");
        const patientAge = localStorage.getItem("patientAge");
        const patientGender = localStorage.getItem("patientGender");


        const screeningsContainer =
            document.getElementById("screeningsContainer");
        let screeningRecords = [];
        const historySearch = document.getElementById("historySearch");
        const historyStatusFilter = document.getElementById("historyStatusFilter");
        const historySummary = document.getElementById("historySummary");

        historySearch.addEventListener("input", renderScreeningHistory);
        historyStatusFilter.addEventListener("change", renderScreeningHistory);


        /*
         * Show the patient information stored in localStorage.
         */
        function showPatientInformation() {

            document.getElementById("patientId").textContent =
                patientId || "—";

            document.getElementById("patientName").textContent =
                patientName || "—";

            document.getElementById("patientAge").textContent =
                patientAge || "—";

            document.getElementById("patientGender").textContent =
                patientGender || "—";
        }


        /*
         * Display a message when no patient has been selected.
         */
        function showMissingPatientMessage() {

            screeningsContainer.innerHTML = `
                <div class="error-message">
                    <h3>Patient information not found</h3>
                    <p>
                        Please register or select a patient first.
                    </p>
                </div>
            `;
        }


        /*
         * Return a readable value instead of showing
         * undefined or null in the interface.
         */
        function displayValue(value) {

            return value === null || value === undefined || value === ""
                ? "—"
                : value;
        }


        /*
         * Create one screening card.
         */
        function createScreeningCard(screening) {

            const card = document.createElement("div");

            card.className = "screening-card";

            const grade = displayValue(screening.drGrade);
            const drClass = displayValue(screening.drClass);
            const confidence = screening.confidence !== null &&
                               screening.confidence !== undefined
                               ? `${screening.confidence}%`
                               : "—";

            const referableProbability =
                screening.referableProbability !== null &&
                screening.referableProbability !== undefined
                    ? `${screening.referableProbability}%`
                    : "—";

            const referableStatus =
                displayValue(screening.referableStatus);

            const sharpness =
                displayValue(screening.sharpness);

            const brightness =
                displayValue(screening.brightness);

            const contrast =
                displayValue(screening.contrast);

            const recommendation =
                displayValue(screening.recommendation);


            card.innerHTML = `
                <div class="screening-card-header">

                    <h3>
                        Screening #${screening.id}
                    </h3>

                    <div class="screening-date">
                        Screening ID: ${screening.id}
                    </div>

                </div>


                <div class="screening-grid">

                    <div class="screening-item">
                        <span>DR Grade</span>
                        <strong>${grade}</strong>
                    </div>

                    <div class="screening-item">
                        <span>DR Class</span>
                        <strong>${drClass}</strong>
                    </div>

                    <div class="screening-item">
                        <span>Confidence</span>
                        <strong>${confidence}</strong>
                    </div>

                    <div class="screening-item">
                        <span>Referable Probability</span>
                        <strong>${referableProbability}</strong>
                    </div>

                    <div class="screening-item">
                        <span>Referable Status</span>
                        <strong>${referableStatus}</strong>
                    </div>

                    <div class="screening-item">
                        <span>Sharpness</span>
                        <strong>${sharpness}</strong>
                    </div>

                    <div class="screening-item">
                        <span>Brightness</span>
                        <strong>${brightness}</strong>
                    </div>

                    <div class="screening-item">
                        <span>Contrast</span>
                        <strong>${contrast}</strong>
                    </div>

                </div>


                <div class="recommendation-box">

                    <span>Recommendation</span>

                    <strong>
                        ${recommendation}
                    </strong>

                </div>


                <button
                    type="button"
                    class="details-button"
                    data-screening-id="${screening.id}"
                >
                    View Details
                </button>
            `;


            const detailsButton =
                card.querySelector(".details-button");


            detailsButton.addEventListener(
                "click",
                () => openScreeningDetails(screening.id)
            );


            return card;
        }


        /*
         * Fetch all screenings belonging to the current patient.
         */
        async function loadScreeningHistory() {

            try {

                const response = await fetch(
                    `${BACKEND_URL}/api/screenings/patient/${patientId}`
                );


                if (!response.ok) {
                    throw new Error(
                        "Unable to load screening history."
                    );
                }


                const records = await response.json();


                if (!Array.isArray(records) || records.length === 0) {

                    screeningsContainer.innerHTML = `
                        <div class="empty-message">

                            <h3>No Screening History</h3>

                            <p>
                                No screenings have been recorded
                                for this patient yet.
                            </p>

                        </div>
                    `;

                    return;
                }


                /*
                 * Latest screening should appear first.
                 */
                records.sort(
                    (a, b) => b.id - a.id
                );

                screeningRecords = records;
                populateHistoryStatusFilter(records);
                renderScreeningHistory();


            } catch (error) {

                console.error(
                    "Unable to load screening history:",
                    error
                );


                screeningsContainer.innerHTML = `
                    <div class="error-message">

                        <h3>
                            Unable to load screening history
                        </h3>

                        <p>
                            Please make sure Spring Boot
                            is running on port 8084.
                        </p>

                    </div>
                `;
            }
        }


        function populateHistoryStatusFilter(records) {
            const statuses = [...new Set(records
                .map(record => record.referableStatus)
                .filter(status => typeof status === "string" && status.trim()))];

            statuses.forEach(status => {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status;
                historyStatusFilter.appendChild(option);
            });
        }


        function renderScreeningHistory() {
            const query = historySearch.value.trim().toLowerCase();
            const selectedStatus = historyStatusFilter.value;
            const visibleRecords = screeningRecords.filter(record => {
                const searchableText = [record.id, record.drGrade, record.drClass]
                    .filter(value => value !== null && value !== undefined)
                    .join(" ")
                    .toLowerCase();
                const matchesQuery = searchableText.includes(query);
                const matchesStatus = selectedStatus === "all" ||
                    record.referableStatus === selectedStatus;
                return matchesQuery && matchesStatus;
            });

            historySummary.textContent = `Showing ${visibleRecords.length} of ${screeningRecords.length} screenings`;
            screeningsContainer.innerHTML = "";

            if (!visibleRecords.length) {
                screeningsContainer.innerHTML = `
                    <div class="empty-message">
                        <h3>No matching screenings</h3>
                        <p>Try changing the search or status filter.</p>
                    </div>
                `;
                return;
            }

            visibleRecords.forEach(record => {
                screeningsContainer.appendChild(createScreeningCard(record));
            });
        }


        /*
         * Open the details page for a particular screening.
         */
        function openScreeningDetails(screeningId) {

            localStorage.setItem(
                "screeningId",
                screeningId
            );

            window.location.href =
                "screening-details.html";
        }


        /*
         * Return to the screening page.
         */
        function goBackToScreening() {

            window.location.href =
                "screening.html";
        }


        /*
         * Start the page.
         */
        if (!patientId) {

            showMissingPatientMessage();

        } else {

            showPatientInformation();
            loadScreeningHistory();
        }

    </script>

</body>

</html>
