<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Screening | Screening History</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .history-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .history-header {
            margin-bottom: 30px;
        }

        .history-header h1 {
            margin-bottom: 8px;
        }

        .history-header p {
            opacity: 0.7;
        }

        .patient-info-card {
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .patient-info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .patient-info-item span {
            display: block;
            opacity: 0.6;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .patient-info-item strong {
            font-size: 17px;
        }

        .screenings-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .screening-card {
            padding: 25px;
            border-radius: 14px;
        }

        .screening-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .screening-card-header h3 {
            margin: 0;
        }

        .screening-date {
            opacity: 0.6;
            font-size: 14px;
        }

        .screening-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .screening-item span {
            display: block;
            opacity: 0.6;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .screening-item strong {
            font-size: 16px;
        }

        .recommendation-box {
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .recommendation-box span {
            display: block;
            opacity: 0.6;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .details-button {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-button {
            margin-top: 25px;
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .loading-message,
        .empty-message,
        .error-message {
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 900px) {

            .patient-info-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .screening-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .patient-info-grid {
                grid-template-columns: 1fr;
            }

            .screening-grid {
                grid-template-columns: 1fr;
            }

            .screening-card-header {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            DR <span>Screening</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="patient.html">
                Patient
            </a>

            <a href="login.html">
                Logout
            </a>

        </nav>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="history-container">


        <!-- ================= HEADER ================= -->

        <div class="history-header">

            <div class="section-label">
                SCREENING RECORDS
            </div>

            <h1>
                Screening History
            </h1>

            <p>
                Review previous diabetic retinopathy screening results.
            </p>

        </div>


        <!-- ================= PATIENT INFO ================= -->

        <section class="patient-info-card">


            <div class="section-label">
                PATIENT INFORMATION
            </div>


            <div class="patient-info-grid">


                <div class="patient-info-item">

                    <span>
                        Patient ID
                    </span>

                    <strong id="patientId">
                        —
                    </strong>

                </div>


                <div class="patient-info-item">

                    <span>
                        Name
                    </span>

                    <strong id="patientName">
                        —
                    </strong>

                </div>


                <div class="patient-info-item">

                    <span>
                        Age
                    </span>

                    <strong id="patientAge">
                        —
                    </strong>

                </div>


                <div class="patient-info-item">

                    <span>
                        Gender
                    </span>

                    <strong id="patientGender">
                        —
                    </strong>

                </div>


            </div>

        </section>


        <!-- ================= SCREENINGS ================= -->

        <section>

            <div
                id="screeningsContainer"
                class="screenings-container"
            >

                <div class="loading-message">

                    Loading screening history...

                </div>

            </div>

        </section>


        <!-- ================= BACK BUTTON ================= -->

        <button
            type="button"
            class="back-button"
            onclick="window.location.href='screening.html'"
        >

            ← Back to Screening

        </button>


    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        const BACKEND_URL =
            "http://localhost:8084";


        /* =====================================================
           LOAD PATIENT INFORMATION
           ===================================================== */

        const patientId =
            localStorage.getItem("patientId");

        const patientName =
            localStorage.getItem("patientName");

        const patientAge =
            localStorage.getItem("patientAge");

        const patientGender =
            localStorage.getItem("patientGender");


        /* =====================================================
           CHECK PATIENT
           ===================================================== */

        if (!patientId) {

            document.getElementById(
                "screeningsContainer"
            ).innerHTML = `

                <div class="error-message">

                    <h3>
                        Patient information not found
                    </h3>

                    <p>
                        Please register or select a patient first.
                    </p>

                </div>

            `;

        } else {


            /* =================================================
               DISPLAY PATIENT INFORMATION
               ================================================= */

            document.getElementById(
                "patientId"
            ).textContent = patientId;


            document.getElementById(
                "patientName"
            ).textContent = patientName || "—";


            document.getElementById(
                "patientAge"
            ).textContent = patientAge || "—";


            document.getElementById(
                "patientGender"
            ).textContent = patientGender || "—";


            /* =================================================
               LOAD SCREENINGS
               ================================================= */

            loadScreeningHistory();

        }


        /* =====================================================
           LOAD SCREENING HISTORY
           ===================================================== */

        async function loadScreeningHistory() {

            const container =
                document.getElementById(
                    "screeningsContainer"
                );


            try {


                const response =
                    await fetch(
                        `${BACKEND_URL}/api/screenings/patient/${patientId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load screening history"
                    );

                }


                const screenings =
                    await response.json();


                if (
                    !Array.isArray(screenings) ||
                    screenings.length === 0
                ) {

                    container.innerHTML = `

                        <div class="empty-message">

                            <h3>
                                No Screening History
                            </h3>

                            <p>
                                No screenings have been recorded
                                for this patient yet.
                            </p>

                        </div>

                    `;

                    return;

                }


                /* =============================================
                   LATEST SCREENING FIRST
                   ============================================= */

                screenings.reverse();


                container.innerHTML = "";


                screenings.forEach(
                    screening => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "screening-card";


                        card.innerHTML = `

                            <div class="screening-card-header">

                                <h3>
                                    Screening #${screening.id}
                                </h3>

                                <div class="screening-date">

                                    Screening ID:
                                    ${screening.id}

                                </div>

                            </div>


                            <div class="screening-grid">


                                <div class="screening-item">

                                    <span>
                                        DR Grade
                                    </span>

                                    <strong>
                                        ${
                                            screening.drGrade !== null &&
                                            screening.drGrade !== undefined
                                                ? screening.drGrade
                                                : "—"
                                        }
                                    </strong>

                                </div>


                                <div class="screening-item">

                                    <span>
                                        DR Class
                                    </span>

                                    <strong>
                                        ${
                                            screening.drClass ||
                                            "—"
                                        }
                                    </strong>

                                </div>


                                <div class="screening-item">

                                    <span>
                                        Confidence
                                    </span>

                                    <strong>
                                        ${
                                            screening.confidence !== null &&
                                            screening.confidence !== undefined
                                                ? screening.confidence + "%"
                                                : "—"
                                        }
                                    </strong>

                                </div>


                                <div class="screening-item">

                                    <span>
                                        Referable Probability
                                    </span>

                                    <strong>
                                        ${
                                            screening.referableProbability !== null &&
                                            screening.referableProbability !== undefined
                                                ? screening.referableProbability + "%"
                                                : "—"
                                        }
                                    </strong>

                                </div>


                                <div class="screening-item">

                                    <span>
                                        Referable Status
                                    </span>

                                    <strong>
                                        ${
                                            screening.referableStatus ||
                                            "—"
                                        }
                                    </strong>

                                </div>


                                <div class="screening-item">

                                    <span>
                                        Sharpness
                                    </span>

                                    <strong>
                                        ${
                                            screening.sharpness !== null &&
                                            screening.sharpness !== undefined
                                                ? screening.sharpness
                                                : "—"
                                        }
                                    </strong>

                                </div>


                                <div class="screening-item">

                                    <span>
                                        Brightness
                                    </span>

                                    <strong>
                                        ${
                                            screening.brightness !== null &&
                                            screening.brightness !== undefined
                                                ? screening.brightness
                                                : "—"
                                        }
                                    </strong>

                                </div>


                                <div class="screening-item">

                                    <span>
                                        Contrast
                                    </span>

                                    <strong>
                                        ${
                                            screening.contrast !== null &&
                                            screening.contrast !== undefined
                                                ? screening.contrast
                                                : "—"
                                        }
                                    </strong>

                                </div>


                            </div>


                            <div class="recommendation-box">

                                <span>
                                    Recommendation
                                </span>

                                <strong>
                                    ${
                                        screening.recommendation ||
                                        "—"
                                    }
                                </strong>

                            </div>


                            <button
                                type="button"
                                class="details-button"
                                onclick="viewScreeningDetails(${screening.id})"
                            >

                                View Details

                            </button>


                        `;


                        container.appendChild(card);

                    }
                );


            } catch (error) {


                console.error(
                    "Screening history error:",
                    error
                );


                container.innerHTML = `

                    <div class="error-message">

                        <h3>
                            Unable to load screening history
                        </h3>

                        <p>
                            Please make sure Spring Boot
                            is running on port 8084.
                        </p>

                    </div>

                `;

            }

        }


        /* =====================================================
           VIEW SCREENING DETAILS
           ===================================================== */

        function viewScreeningDetails(
            screeningId
        ) {

            /*
             * Store selected screening ID.
             * screening-details.html will use this ID
             * to fetch the exact screening record.
             */

            localStorage.setItem(
                "screeningId",
                screeningId
            );


            window.location.href =
                "screening-details.html";

        }


    </script>


</body>

</html>
