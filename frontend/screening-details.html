<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DR Screening | Screening Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            DR <span>Screening</span>
        </div>

        <nav>
            <a href="index.html">
                Home
            </a>

            <a href="patient.html">
                Patient
            </a>

            <a href="login.html">
                Logout
            </a>
        </nav>

    </nav>


    <!-- Main content -->

    <main class="details-container">

        <header class="details-header">

            <div class="section-label">
                SCREENING REVIEW
            </div>

            <h1>
                Screening Details
            </h1>

            <p>
                Detailed AI-assisted diabetic retinopathy
                screening report.
            </p>
            <p class="clinical-disclaimer">
                Results are AI-assisted screening estimates, not a confirmed diagnosis. Review with a qualified healthcare professional.
            </p>

        </header>


        <!-- Screening information is loaded here -->

        <div id="detailsContent">

            <div class="loading-message">
                Loading screening details...
            </div>

        </div>


        <!-- Report actions -->

        <div class="report-actions">

            <button
                type="button"
                class="back-button"
                onclick="window.location.href='history.html'"
            >
                ← Back to History
            </button>

            <button
                type="button"
                class="report-button"
                onclick="generatePDFReport()"
            >
                Generate PDF Report
            </button>

        </div>

    </main>


    <script>

        const BACKEND_URL = "http://localhost:8084";

        /*
         * The history page stores the selected
         * screening ID before opening this page.
         */

        const screeningId =
            localStorage.getItem("screeningId");


        /*
         * If there is no screening ID, there is
         * nothing to display.
         */

        if (!screeningId) {

            document.getElementById("detailsContent").innerHTML = `

                <div class="error-message">

                    <h3>
                        Screening not found
                    </h3>

                    <p>
                        Please select a screening from
                        the screening history.
                    </p>

                </div>

            `;

        } else {

            loadScreeningDetails();

        }


        /*
         * Load screening details from Spring Boot.
         */

        async function loadScreeningDetails() {

            const container =
                document.getElementById("detailsContent");

            try {

                const response = await fetch(
                    `${BACKEND_URL}/api/screenings/${screeningId}`
                );

                if (!response.ok) {

                    throw new Error(
                        "Failed to load screening details"
                    );

                }

                const screening =
                    await response.json();

                console.log(
                    "Screening details:",
                    screening
                );

                displayScreeningDetails(screening);

            } catch (error) {

                console.error(
                    "Screening details error:",
                    error
                );

                container.innerHTML = `

                    <div class="error-message">

                        <h3>
                            Unable to load screening details
                        </h3>

                        <p>
                            Please make sure Spring Boot
                            is running on port 8084.
                        </p>

                    </div>

                `;

            }
        }


        /*
         * Display the screening information.
         */

        function displayScreeningDetails(screening) {

            const container =
                document.getElementById("detailsContent");


            // Patient information

            const patientName =
                localStorage.getItem("patientName") || "—";

            const patientAge =
                localStorage.getItem("patientAge") || "—";

            const patientGender =
                localStorage.getItem("patientGender") || "—";


            // Original fundus image

            let originalImageHTML = `

                <div class="image-placeholder">
                    Original fundus image not available.
                </div>

            `;

            if (
                screening.originalImage &&
                screening.originalImage.trim() !== ""
            ) {

                let originalImageSrc =
                    screening.originalImage.trim();


                /*
                 * The database may contain either a complete
                 * data URL or only the Base64 string.
                 */

                if (
                    !originalImageSrc.startsWith("data:image")
                ) {

                    originalImageSrc =
                        "data:image/jpeg;base64," +
                        originalImageSrc;

                }


                originalImageHTML = `

                    <img
                        src="${originalImageSrc}"
                        class="screening-image"
                        alt="Original fundus image"
                    >

                `;

            }


            // Grad-CAM image

            let gradcamImageHTML = `

                <div class="image-placeholder">
                    Grad-CAM image not available.
                </div>

            `;

            if (
                screening.gradcamImage &&
                screening.gradcamImage.trim() !== ""
            ) {

                let gradcamSrc =
                    screening.gradcamImage.trim();


                /*
                 * FastAPI may return a complete data URL
                 * or only the Base64 image string.
                 */

                if (
                    !gradcamSrc.startsWith("data:image")
                ) {

                    gradcamSrc =
                        "data:image/png;base64," +
                        gradcamSrc;

                }


                gradcamImageHTML = `

                    <img
                        src="${gradcamSrc}"
                        class="screening-image"
                        alt="Grad-CAM explanation"
                        onerror="showGradcamError(this)"
                    >

                `;

            }


            // Build the result page

            container.innerHTML = `

                <!-- Patient information -->

                <section class="patient-card">

                    <div class="section-label">
                        PATIENT INFORMATION
                    </div>

                    <div class="patient-grid">

                        <div class="info-item">

                            <span>
                                Patient ID
                            </span>

                            <strong>
                                ${screening.patientId ?? "—"}
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Name
                            </span>

                            <strong>
                                ${escapeHTML(patientName)}
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Age
                            </span>

                            <strong>
                                ${escapeHTML(patientAge)}
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Gender
                            </span>

                            <strong>
                                ${escapeHTML(patientGender)}
                            </strong>

                        </div>

                    </div>

                </section>


                <!-- AI screening result -->

                <section class="result-card">

                    <div class="section-label">
                        AI SCREENING RESULT
                    </div>

                    <div class="result-grid">

                        <div class="info-item">

                            <span>
                                Screening ID
                            </span>

                            <strong>
                                ${screening.id ?? "—"}
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                DR Grade
                            </span>

                            <strong>
                                ${screening.drGrade ?? "—"}
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                DR Class
                            </span>

                            <strong>
                                ${escapeHTML(
                                    screening.drClass || "—"
                                )}
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Confidence
                            </span>

                            <strong>
                                ${
                                    screening.confidence !== null &&
                                    screening.confidence !== undefined
                                        ? screening.confidence + "%"
                                        : "—"
                                }
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Referable Status
                            </span>

                            <strong>
                                ${escapeHTML(
                                    screening.referableStatus || "—"
                                )}
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Referable Probability
                            </span>

                            <strong>
                                ${
                                    screening.referableProbability !== null &&
                                    screening.referableProbability !== undefined
                                        ? screening.referableProbability + "%"
                                        : "—"
                                }
                            </strong>

                        </div>

                    </div>

                </section>


                <!-- Image quality -->

                <section class="quality-card">

                    <div class="section-label">
                        IMAGE QUALITY
                    </div>

                    <div class="quality-grid">

                        <div class="info-item">

                            <span>
                                Sharpness
                            </span>

                            <strong>
                                ${
                                    screening.sharpness !== null &&
                                    screening.sharpness !== undefined
                                        ? screening.sharpness
                                        : "—"
                                }
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Brightness
                            </span>

                            <strong>
                                ${
                                    screening.brightness !== null &&
                                    screening.brightness !== undefined
                                        ? screening.brightness
                                        : "—"
                                }
                            </strong>

                        </div>


                        <div class="info-item">

                            <span>
                                Contrast
                            </span>

                            <strong>
                                ${
                                    screening.contrast !== null &&
                                    screening.contrast !== undefined
                                        ? screening.contrast
                                        : "—"
                                }
                            </strong>

                        </div>

                    </div>

                </section>


                <!-- Images and explainability -->

                <section class="images-card">

                    <div class="section-label">
                        AI EXPLANATION
                    </div>

                    <div class="images-grid">

                        <div class="image-box">

                            <h3>
                                Original Fundus Image
                            </h3>

                            ${originalImageHTML}

                        </div>


                        <div class="image-box">

                            <h3>
                                Grad-CAM
                            </h3>

                            ${gradcamImageHTML}

                        </div>

                    </div>

                </section>


                <!-- Recommendation -->

                <section class="recommendation-card">

                    <div class="section-label">
                        RECOMMENDATION
                    </div>

                    <div class="recommendation-box">

                        ${
                            escapeHTML(
                                screening.recommendation ||
                                "No recommendation available."
                            )
                        }

                    </div>

                </section>

            `;

        }


        /*
         * Show a message when the Grad-CAM image
         * cannot be loaded.
         */

        function showGradcamError(image) {

            image.outerHTML = `

                <div class="image-placeholder">
                    Grad-CAM image could not be loaded.
                </div>

            `;

        }


        /*
         * Basic HTML escaping for values coming
         * from localStorage or the database.
         */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
         * Generate and download the PDF report.
         *
         * The actual PDF is created by Spring Boot.
         * This function only requests the PDF and
         * downloads the returned file.
         */

        async function generatePDFReport() {

            if (!screeningId) {

                alert(
                    "Screening information not found."
                );

                return;

            }


            const button =
                document.querySelector(".report-button");


            try {

                button.disabled = true;
                button.textContent =
                    "Generating Report...";


                const response = await fetch(
                    `${BACKEND_URL}/api/reports/screening/${screeningId}`
                );


                if (!response.ok) {

                    throw new Error(
                        "Unable to generate the report."
                    );

                }


                const pdfBlob =
                    await response.blob();


                const downloadUrl =
                    window.URL.createObjectURL(pdfBlob);


                const link =
                    document.createElement("a");


                link.href = downloadUrl;

                link.download =
                    `DR_Screening_Report_${screeningId}.pdf`;


                document.body.appendChild(link);

                link.click();

                link.remove();


                window.URL.revokeObjectURL(
                    downloadUrl
                );


            } catch (error) {

                console.error(
                    "PDF report error:",
                    error
                );

                alert(
                    "Unable to generate the PDF report. " +
                    "Please try again."
                );


            } finally {

                button.disabled = false;

                button.textContent =
                    "Generate PDF Report";

            }

        }

    </script>

</body>

</html>
